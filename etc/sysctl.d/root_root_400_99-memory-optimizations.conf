# --- MEMORY, SWAP & GAMING OPTIMIZATIONS (64GB RAM & NVMe 2TB) ---

# If using a pure Swap on NVMe - leave 1.
# If zswap/zRAM is enabled, it is better to change to 10.
vm.swappiness = 1

# Background caching: 10% of 64GB is 6.4 GB of "dirty" pages before the background flush starts.
# Maximum cache: 20% (12.8 GB), after which processes will be blocked for forced writing to disk.
vm.dirty_background_ratio = 10
vm.dirty_ratio = 20

# Increase the lifetime of dirty pages in memory to 60 seconds.
# The kernel will wake up for checking every 30 seconds. This completely removes disk freezes in games.
vm.dirty_expire_centisecs = 6000
vm.dirty_writeback_centisecs = 3000

# Required for heavy games (Steam Play / Proton, Cyberpunk 2077, Starfield, Hogwarts Legacy).
# Protects against crashes due to lack of limits on the number of memory mapping sections.
vm.max_map_count = 4194304

# Reduce the pressure on the virtual file system (VFS) cache from 100 to 50.
# The kernel will hold file indexes (inodes/dentries) in RAM for longer, speeding up repeated access to game files.
vm.vfs_cache_pressure = 50
